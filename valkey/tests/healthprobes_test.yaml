suite: health probes configuration
templates:
  - templates/deploy_valkey.yaml
  - templates/statefulset.yaml
  - templates/cluster-statefulset.yaml
  - templates/init_config.yaml
tests:
  - it: renders all default probes on the standalone Deployment
    template: templates/deploy_valkey.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: [ "sh", "-c", "valkey-cli ping 2>&1 | grep -qE 'PONG|NOAUTH|LOADING'" ]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: [ "sh", "-c", "valkey-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'" ]
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 6

  - it: renders mode-specific default probes on the replica StatefulSet
    template: templates/statefulset.yaml
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
    asserts:
      - exists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: preserves the cluster startup delay while using the common probe renderer
    template: templates/cluster-statefulset.yaml
    set:
      cluster.enabled: true
      cluster.persistence.size: "5Gi"
    asserts:
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].startupProbe.initialDelaySeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 0

  - it: renders every supported timing field
    template: templates/deploy_valkey.yaml
    set:
      readinessProbe.initialDelaySeconds: 7
      readinessProbe.periodSeconds: 11
      readinessProbe.timeoutSeconds: 2
      readinessProbe.failureThreshold: 9
      readinessProbe.successThreshold: 2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 11
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 2
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 9
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.successThreshold
          value: 2

  - it: omits a probe when it is disabled
    template: templates/deploy_valkey.yaml
    set:
      startupProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: replaces the default handler and timing when customProbe is set
    template: templates/deploy_valkey.yaml
    set:
      livenessProbe.customProbe:
        tcpSocket:
          port: 6379
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 6379
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.exec
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds

  - it: supports enabled and customProbe in a mode-specific probe block
    template: templates/statefulset.yaml
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.startupProbe.enabled: false
      replica.readinessProbe.customProbe:
        httpGet:
          path: /ready
          port: 8080
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.exec
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds

  - it: uses the TLS-aware ping command when TLS is enabled
    template: templates/deploy_valkey.yaml
    set:
      tls.enabled: true
      tls.caPublicKey: ca.crt
      tls.existingSecret: valkey-tls
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          value: [ "sh", "-c", "valkey-cli --tls --cacert /tls/ca.crt ping 2>&1 | grep -qE 'PONG|NOAUTH'" ]
